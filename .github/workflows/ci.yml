name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/ci-lint.sh

  database:
    name: Migrations and seeding (bare PostgreSQL)
    runs-on: ubuntu-latest
    # The compat shim lets the real migrations run on a stock PostgreSQL image,
    # so this job needs no Supabase stack and no Docker-in-Docker. Same major
    # version as Supabase's own image.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      PATH_DB_MODE: bare
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/ci-database-bare.sh

  supabase:
    name: RLS and database functions (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Applies every migration and supabase/seed.sql from scratch. A migration
      # that works on bare PostgreSQL but not on Supabase fails here.
      - run: ./scripts/ci-supabase-pgtap.sh
